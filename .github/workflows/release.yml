# Releases with changesets (DECISIONS #110). On main: if there are changesets, open / update a
# "Version packages" pull request; when that is merged, publish to npm with provenance.
name: Release

on:
  push:
    branches: [main]

concurrency: release

permissions:
  contents: write # push the version commit and tags
  pull-requests: write # open the "Version packages" pull request
  id-token: write # npm trusted publishing + provenance

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile

      - uses: changesets/action@v1
        with:
          version: pnpm changeset version
          publish: pnpm release
          title: Version packages
          commit: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Trusted publishing (set up on npmjs.com after the first release) needs no token;
          # until then an npm token in the NPM_TOKEN secret works too.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'
